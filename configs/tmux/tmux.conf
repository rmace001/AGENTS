# Move status bar to the top
set-option -g status-position top

# Enable mouse support for scrolling and pane clicking
set -g mouse on

# Keep more terminal history
set -g history-limit 50000

# Split in the current pane's directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate panes with prefix + arrow key
bind -r Left  select-pane -L
bind -r Down  select-pane -D
bind -r Up    select-pane -U
bind -r Right select-pane -R

# Reload configuration with prefix + r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# A simple, readable status bar
set -g status-style "bg=default,fg=colour250"
set -g status-left-length 30
set -g status-left "#[bold,fg=colour81] #S #[default]"
set -g status-right ""
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bold,fg=colour81] #I:#W #[default]"

# Start window/pane counting from 1 not 0
set -g base-index 1
setw -g pane-base-index 1 

# Automatically renumber windows after closing
set-option -g renumber-windows on

# Change prefix key from ctrl+b to ctrl+space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Create the 'main' session with initial windows unless it already exists.
# %if evaluates a tmux format, not a shell command: the S: loop emits X for a
# session named main, so reloading this file (source-file) skips this block.
%if "#{==:#{S:#{?#{==:#{session_name},main},X,}},}"
  new-session -d -s main -n "terminal"
  new-window -t main:2 -n "fe"
  new-window -t main:3 -n "mmc"

  # You can send commands to windows if desired, e.g.:
  # send-keys -t main:server "npm run dev" Enter

  # Select your preferred starting window by name or index
  select-window -t main:terminal
%endif

