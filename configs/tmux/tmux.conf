# Move status bar to the top
set-option -g status-position top

# Enable mouse support for scrolling and pane clicking
set -g mouse on

# Keep more terminal history
set -g history-limit 50000

# Split in the current pane's directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate panes with prefix + arrow key
bind -r Left  select-pane -L
bind -r Down  select-pane -D
bind -r Up    select-pane -U
bind -r Right select-pane -R

# Reload configuration with prefix + r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# A simple, readable status bar
set -g status-style "bg=default,fg=colour250"
set -g status-left-length 30
set -g status-left "#[bold,fg=colour81] #S #[default]"
set -g status-right ""
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bold,fg=colour81] #I:#W #[default]"
    
